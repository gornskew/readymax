# DO NOT EDIT - Generated from services.sexp
# Regenerate with: (skewed-generate-all-configs)

services:

  cyclops:
    image: registry.gitlab.genworks.com/gornskew/cyclops:devo
    container_name: cyclops
    hostname: cyclops
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "19069:9069"
    environment:
      - HTTP_PORT=9069
      - HTTP_HOST_PORT=19069
      - START_HTTP=true
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - type: bind
        source: ${PROJECTS_DIR}
        target: /projects
        bind:
          create_host_path: true
      - ${CYCLOPS_CONFIG:-${PROJECTS_DIR}/cyclops-stack/cyclops-dev.sexp}:/etc/cyclops/cyclops.sexp:ro
    networks:
      - skewed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9069/_cyclops/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
