# GitLab CI for skewed-emacs container images (gornskew/skewed-emacs on
# Docker Hub).
#
# Native per-arch builds -- no QEMU emulation (see the exec-format-error
# saga on narad, docker/CI.md).  Each architecture builds on its own
# runner and pushes arch-suffixed tags (e.g. devo-full-arm64); the
# stitch job then merges them into the canonical multi-arch tags
# (devo-full, devo, latest).
#
# Build jobs pass --skip-manifests so the manifest merge happens exactly
# once per pipeline (in stitch-manifests).  Docker Hub rate-limits are
# real and shared (200/hr for the gornskew account, 100/hr anonymous per
# source IP -- and the whole site NATs through one IP): the 2026-08-08
# pilot died at 429 Too Many Requests because every build job ran the
# full 8-tag manifest merge and then the stitch job ran it again.
#
# Runners (gitlab.genworks.com):
#   arm64 -- cl-arm64-build-1-genworks (Mac mini M1 "sevam", docker
#            executor against the colima socket, instance runner #44,
#            tag "arm64").
#   amd64 -- balaram (shell executor, tag "amd64"; leg proven green
#            2026-08-08, job 16201 build phase).
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   DOCKERHUB_USER  -- Docker Hub account with push rights to gornskew/*
#   DOCKERHUB_TOKEN -- read/write access token (masked)
#
# docker/build honors CI_COMMIT_REF_NAME for branch detection, so tags
# come out as <branch>-<target>[-<arch>] automatically.

stages:
  - build
  - manifest

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "devo" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  image: docker:29.6.2
  before_script:
    # docker CLI images are alpine: docker/build needs bash + curl.
    # Shell-executor runners have no apk (and already have bash/curl).
    - if command -v apk >/dev/null; then apk add --no-cache bash curl; fi
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin

build-amd64:
  stage: build
  tags:
    - amd64
  script:
    - docker/build --all --push --skip-manifests

build-arm64:
  stage: build
  tags:
    - arm64
  before_script:
    # Same as stitch-manifests: this runs on the arm64 runner (the mini),
    # which has no persistent docker login, so unauthenticated pulls/HEADs
    # of gornskew/skewed-emacs manifests hit Docker Hub's anonymous cap
    # (429).  Authenticate first (DOCKERHUB_TOKEN is unprotected+masked,
    # reaches devo builds); gornskew owns the repo -> its pulls uncapped.
    - if [ -n "$DOCKERHUB_TOKEN" ]; then echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin; fi
  script:
    - docker/build --all --push --skip-manifests

# The single manifest pass per pipeline: merges the arch-suffixed tags
# pushed by the build jobs (plus any pre-existing ones on Docker Hub)
# into the canonical multi-arch tags.
stitch-manifests:
  stage: manifest
  tags:
    - arm64
  before_script:
    # The stitch runs on the arm64 runner (cl-arm64-build-1), which --
    # unlike balaram -- has no persistent docker login, so its manifest
    # pulls went out UNAUTHENTICATED and hit Docker Hub's 100/6h
    # anonymous cap (red stitch on 2026-08-09, blocking devo-full even
    # when both build legs were green).  Authenticate first: gornskew
    # owns the repo, so authenticated pulls of its own images are not
    # rate-capped.
    - if [ -n "$DOCKERHUB_TOKEN" ]; then echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin; fi
  script:
    - docker/build --manifest-only
